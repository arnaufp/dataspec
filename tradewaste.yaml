      min: ''
      max: 128
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Billing Address Line 2
      description: The second line of the billing address, used for additional location
        details such as suite, unit, or building name.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Billing Address Line 3
      description: The third line of the billing address, used for further address
