  notifications:
    name: 5. Notifications
    description: 'The Notifications table stores operational messages associated with
      specific premises within the trade waste system. These notifications are intended
      for field crews and operational staff, providing important instructions, alerts,
      or contextual information relevant to service delivery.


      Notifications may require acknowledgment or a defined response, and they are
      typically active only within a specified date range. This ensures that crews
      are presented with timely and relevant information when attending a premises.'
    fields:
    - name: Unique Property Reference
      description: Unique identifier for the property, bin store or collection point.
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: 'Only ''Reference'' present on the ''LinkTo:non-nlpg-property-details''
        table,

        ''Bin Store ID'' present on the ''LinkTo:bin-store-property-details'' table
        or

        UPRN present on the LLPG dataset'
      remarks: This field links the notification to a specific property or bin store  within
        the system, ensuring that messages are displayed to crews servicing that location.Therefore
        this unique reference must exist on the LLPG, Non NLPG or Bin Store table
        and acts as a foreign key to these tables.
    - name: Notification
      description: The main body of the message. This contains the information, instruction,
        or alert that should be communicated to the crew when interacting with the
        premises.
      type: string
      required: true
      unique: false
      min: ''
      max: 256
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Response Type
      description: Defines the type of response expected from the crew upon viewing
        the notification
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Notification Response Type
      remarks: ''
    - name: Notification Type
      description: Categorizes the notification based on its purpose or severity
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Notification Type
      remarks: ''
    - name: Start Date
      description: The date and time from which the notification becomes active and
        visible to crews. Before this point, the notification should not be displayed.
      type: datetime
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: End Date
      description: The date and time at which the notification expires and is no longer
        shown to crews. This ensures outdated or irrelevant messages are automatically
        removed from view.
      type: datetime
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
  customer-accounts:
    name: 6. Customer Accounts
    description: The Customer Accounts table stores details of customers who receive
      trade waste services. It includes identification information, contact details,
      billing address, and account lifecycle data.
    fields:
    - name: Name
      description: The primary name used to identify the customer account. This may
        be a trading name, individual name, or account label used internally.
      type: string
      required: true
      unique: false
      min: ''
      max: 128
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Account No
      description: A unique identifier assigned to the customer account. This is used
        to reference the account across the system
      type: string
      required: true
      unique: true
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a primary key of the Customer Accounts table.
    - name: Company Name
      description: The registered legal name of the company associated with the account,
        where applicable.
      type: string
      required: false
      unique: false
      min: ''
      max: 160
      decimals: ''
      acceptedValues: ''
      remarks: ''
