title: Trade Waste
groups:
- label: Trade Waste
  tables:
  - container-types
  - pricing-bill-items
  - non-nlpg-property-details
  - bin-store-property-details
  - notifications
  - customer-accounts
  - customer-account-notes
  - arrangements
  - standard-exceptions
  - waste-rounds
  - bank-holidays
- label: Reference
  tables:
  - Lookups
tables:
  container-types:
    name: 1. Container Types
    description: "This table defines all container types available for Trade Waste\
      \ services.\nIt provides essential details such as the container\u2019s description,\
      \ unique code, intended usage, capacity, and whether it is classified as a Trade\
      \ Waste container. "
    fields:
    - name: Description
      description: "A short, descriptive name for the container type (e.g., \u201C\
        240L Wheelie Bin\u201D). This helps identify the container in plain language"
      type: string
      required: true
      unique: false
      min: ''
      max: 128
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Code
      description: A unique alphanumeric identifier for the container type. This ensures
        consistency and avoids ambiguity when referencing containers in the system.
      type: string
      required: true
      unique: true
      min: ''
      max: 10
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a primary key of the Container Types table.
    - name: Usage Type
      description: "Indicates the intended use of the container (e.g., \u201CGeneral\
        \ Waste,\u201D \u201CRecycling,\u201D \u201CFood Waste\u201D). This helps\
        \ categorize containers by their waste stream."
      type: string
      required: true
      unique: false
      min: ''
      max: 48
      decimals: ''
      acceptedValues: Lookup list will be created with the provided values
      remarks: ''
    - name: Capacity
      description: 'The volume or size of the container, expressed in litres (e.g.,
        240L, 1100L). '
      type: number
      required: true
      unique: false
      min: ''
      max: ''
      decimals: false
      acceptedValues: Lookup list will be created with the provided values
      remarks: ''
    - name: Trade container type
      description: Used to identify the container type as a trade waste container.
        Always TRUE
      type: boolean
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: Always set to TRUE
  pricing-bill-items:
    name: 2. Pricing Bill Items
    description: 'This table contains the pricing details for Trade Waste services,
      specifying the rates applied per lift or collection for each container type.
      It ensures accurate billing by linking container types to their corresponding
      bill items, rates, and applicable date ranges.


      You must have as many price records as the number of rate types multiplied by
      the number of container types. Each price for every combination of rate type
      and container type is a bill item.


      Records in this table = containerTypes x rateTypes'
    fields:
    - name: Bill Item Name
      description: "The name of the billable item (e.g., \u201CTrade 240 ltr Recycling\u201D\
        ). This identifies the chargeable container collection/lift activity."
      type: string
      required: true
      unique: true
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Container Type Code
      description: 'The unique code for the container type. Ensures consistency and
        accurate mapping between pricing and container type data. '
      type: string
      required: true
      unique: ''
      min: ''
      max: 10
      decimals: ''
      acceptedValues: Only 'Code' present on the 'LinkTo:container-types' table
      remarks: This field acts as a foreign key to the Container Types table.
    - name: Bill Item Default Rate
      description: "Rate charged per lift / collection for this container type and\
        \ rate type (e.g., \xA35.00). "
      type: number
      required: true
      unique: ''
      min: ''
      max: ''
      decimals: true
      acceptedValues: ''
      remarks: ''
    - name: Bill Item Rate Type
      description: "Indicates the type of rate applied (e.g., \u201CStandard\u201D\
        , \u201CCharity\u201D, \u201CSchool\u201D)"
      type: string
      required: true
      unique: ''
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Lookup list will be created with the provided values
      remarks: ''
    - name: Bill Item Start Date
      description: The date from which the rate becomes effective, typically 1st April
        (2025-04-01T00:00)
      type: datetime
      required: true
      unique: ''
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Bill Item End Date
      description: The date until which the rate is valid, typically 31st March (2026-03-31T23:59)
      type: datetime
      required: true
      unique: ''
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
  non-nlpg-property-details:
    name: 3. Non NLPG Property Details
    description: "This table captures extra property information for waste collection\
      \ points that may not be part of the standard UK NLPG (National Land and Property\
      \ Gazetteer) dataset. \nIt ensures accurate identification and location of premises\
      \ that require Trade Waste services but fall outside the NLPG, such as non-standard\
      \ addresses. "
    fields:
    - name: Reference
      description: A unique identifier for the property or collection point. This
        acts as the primary reference for the record within the system.
      type: string
      required: true
      unique: true
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a primary key of the Non NLPG Property Details table.
    - name: Trading Name
      description: 'The business name associated with the property '
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Sub Premises Reference/s
      description: ??
      type: ''
      required: ''
      unique: ''
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Longitude / Easting
      description: 'Longitude (decimal degrees WGS84) or Easting (BNG) coordinate
