  customer-account-notes:
    name: 7. Customer Account Notes
    description: 'The Customer Account Notes table stores time-stamped notes associated
      with customer accounts. These notes provide a historical record of interactions,
      observations, or important information relevant to account management.


      They are typically used to track communications, issues, or actions taken in
      relation to a specific account.'
    fields:
    - name: Account No
      description: A unique identifier linking the note to a specific customer account.
        This field acts as a foreign key to the Customer Accounts table, ensuring
        that each note is associated with the correct account.
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Account No' present on the 'LinkTo:customer-accounts'
        table
      remarks: This field acts as a foreign key to the Customer Accounts table.
    - name: Notes
      description: The content of the note. This may include details of customer interactions,
        service issues, internal comments, or any other relevant information that
        needs to be recorded against the account.
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Notes Date and Time
      description: The date and time when the note was created or recorded. This provides
        a chronological reference for tracking account history and auditing interactions.
      type: datetime
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
  arrangements:
    name: 8. Arrangements
    description: 'The Arrangements table defines the service agreements between customer
      accounts and the trade waste collection service. It captures details about container
      types, collection frequency, scheduling rules, and operational parameters required
      to deliver the service.


      This table is central to service planning and execution, determining how and
      when waste collections are carried out for each premises. It also supports billing
      configuration and regulatory classification through associated codes.'
    fields:
    - name: Arrangement ID
      description: A unique identifier for each arrangement record. This distinguishes
        individual service agreements within the system.
      type: string
      required: true
      unique: true
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a primary key of the Arrangements table
    - name: Account No
      description: The unique identifier of the customer account associated with the
        arrangement. Acts as a foreign key to the Customer Accounts table.
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a foreign key to the Customer Accounts table.
    - name: Account Name
      description: 'The name of the customer account linked to the arrangement. '
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Account No' present on the 'LinkTo:customer-accounts'
        table
      remarks: This field acts as a foreign key to the Customer Accounts table, ensuring
        that each arrangement is associated with the correct account.
    - name: Unique Property Reference
      description: A unique identifier for the premises where the service is delivered.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only UPRN present on the LLPG dataset
      remarks: This field acts as a foreign key to the LLPG dataset. An Arrangement
        record can only be linked to either a Unique Property Reference (UPRN), Non-NLPG
        reference or Bin Store ID.
    - name: Bin Store Reference
      description: 'An identifier for the bin storage location at the premises, if
        applicable. '
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Bin Store ID' present on the 'LinkTo:bin-store-property-details'
        table
      remarks: This field acts as a foreign key to the Non NLPG Property Details table.
        An Arrangement record can only be linked to either a Unique Property Reference
        (UPRN), Non-NLPG reference or Bin Store ID.
    - name: Non NLPG Reference
      description: An alternative location or property reference used where a standard
        property reference (e.g., UPRN) is not available.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Reference' present on the 'LinkTo:non-nlpg-property-details'
        table
      remarks: This field acts as a foreign key to the Bin Store Property Details
        table. An Arrangement record can only be linked to either a Unique Property
        Reference (UPRN), Non-NLPG reference or Bin Store ID.
    - name: Container Type Description
      description: A descriptive label for the type of container used in the arrangement.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Container Type Code
      description: 'Standardized code representing the container type. '
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Code' present on the 'LinkTo:container-types' table
      remarks: This field acts as a foreign key to the Container Types table.
    - name: Number of Containers
      description: The total number of containers assigned under this arrangement.
      type: number
      required: true
      unique: false
      min: 1
      max: 20
      decimals: false
      acceptedValues: ''
      remarks: ''
    - name: Rate Type
      description: Defines the billing rate structure applied to the arrangement
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Bill item Rate Type' present on the 'LinkTo:pricing-bill-items'
        table
      remarks: ''
    - name: Billing cycle
      description: Specifies how frequently billing occurs for the arrangement
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Billing Cycle
      remarks: ''
    - name: SIC code
      description: "The Standard Industrial Classification (SIC) code representing\
        \ the customer\u2019s business activity."
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only valid SIC Codes
      remarks: ''
    - name: EWC code
      description: The European Waste Catalogue (EWC) code identifying the type of
        waste collected under the arrangement.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only valid EWC Codes
      remarks: ''
    - name: Start Date Historical
      description: The original start date of the arrangement, retained for historical
        or migration purposes.
      type: datetime
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Start Date
      description: The current active start date of the arrangement.
      type: datetime
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: For Week 1 and Week 2 arrangements, you need to enter a date that falls
        within Week 1 or Week 2 respectively. The system will use this date as input
        to determine what is considered Week 1 and what is considered Week 2.
    - name: Use Domestic Containers (T/F)
      description: 'Indicates whether domestic containers are used for this arrangement. '
      type: boolean
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Generate Container Jobs (T/F)
      description: Specifies whether collection jobs should be automatically generated
        for this arrangement
      type: boolean
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Waste Round/s
      description: Identifies the collection round(s) assigned to this arrangement.
        May include one or multiple rounds.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Waste Round Name' present on the 'LinkTo:waste-rounds'
        table
      remarks: If the arrangement is linked to more than one round, provide the round
        names separated by |. E.g. TW-REC-MON|TW-REC-WED|TW-REC-FRI
    - name: Specific day of week (T/F)
      description: Indicates whether collections occur on specific day(s) of the week.
      type: boolean
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: An Arrangement record can only have one of the four types of frequency.
        Either specific day of week, specific day of month, named day of named week
        each month or specific dates
    - name: Named Day/s (week)
      description: The specific weekday(s) on which collections are scheduled
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Named Days Week
      remarks: Only fill if specific date of week is TRUE
    - name: Frequency (weeks)
      description: The interval, in weeks, between collections.
      type: number
      required: false
      unique: false
      min: 1
      max: 4
      decimals: false
      acceptedValues: ''
      remarks: Only fill if specific date of week is TRUE
    - name: Week Reference
      description: Defines the reference week used to calculate recurring collection
        cycles.
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: Only fill if specific date of week is TRUE
    - name: Specific day of month (T/F)
      description: Indicates whether collections occur on specific day(s) of the month.
      type: boolean
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: An Arrangement record can only have one of the four types of frequency.
        Either specific day of week, specific day of month, named day of named week
        each month or specific dates
    - name: Day number/s of month
      description: 'The numeric day(s) of the month when collections take place '
      type: number
      required: false
      unique: false
      min: 1
      max: 31
      decimals: false
      acceptedValues: ''
      remarks: Only fill if specific date of month is TRUE
    - name: Frequency (months)
      description: The interval, in months, between collections.
      type: number
      required: false
      unique: false
      min: 1
      max: 2
      decimals: false
      acceptedValues: ''
      remarks: Only fill if specific date of month is TRUE
    - name: Named day of named week each month (T/F)
      description: "Indicates whether collections follow a pattern such as \u201C\
        first Monday of the month.\u201D"
      type: boolean
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: An Arrangement record can only have one of the four types of frequency.
        Either specific day of week, specific day of month, named day of named week
        each month or specific dates
    - name: Named day/s (month)
      description: 'The weekday(s) used in monthly scheduling patterns '
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Named Days Week
      remarks: Only fill if named day of named week each month is TRUE
    - name: Week Number/s
      description: The week number(s) within the month used for scheduling
      type: number
      required: false
      unique: false
      min: 1
      max: 5
      decimals: false
      acceptedValues: ''
      remarks: Only fill if named day of named week each month is TRUE
    - name: Specific dates (T/F)
      description: Indicates whether collections occur on explicitly defined dates
        rather than recurring rules
      type: boolean
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: An Arrangement record can only have one of the four types of frequency.
        Either specific day of week, specific day of month, named day of named week
        each month or specific dates
    - name: On dates
      description: A list of specific calendar dates on which collections are scheduled.
      type: date
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: Only fill if specific date is TRUE. Separate the dates by | e.g. 2026-01-20|2026-02-20|2026-03-20
    - name: Standard exceptions
      description: Defines recurring exceptions to the schedule (e.g., public holidays).
      type: string
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Only 'Description' present on the 'LinkTo:standard-exceptions'
        table
      remarks: This field acts as a foreign key to the Standard Exceptions table.
    - name: Adhoc exceptions
      description: Defines one-off or irregular exceptions to the schedule, such as
        temporary suspensions
      type: date
      required: false
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: Separate the dates by | e.g. 2026-01-20|2026-02-20|2026-03-20
  standard-exceptions:
    name: 9. Standard exceptions
    description: The Standard Exceptions table defines collection exceptions to scheduled
      service arrangements. These exceptions represent predictable non-service periods
      such as public holidays, planned service suspensions, or other recurring dates
      when collections should not take place.
    fields:
    - name: Description
      description: A descriptive name for the exception that serves as a unique identifier
        for each standard exception record
      type: string
      required: true
      unique: true
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a primary key of the Standard Exceptions table.
        Must be unique as this is used to reference the standard exception on other
        tables
    - name: Dates
      description: The date or range of dates on which the exception applies. This
        defines when services are impacted and should not be scheduled
      type: date
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: Separate the range of dates by | e.g. 2026-08-01|2026-08-31 for August
        Summer holidays
  waste-rounds:
    name: 10. Waste rounds
    description: The Waste Rounds table defines operational collection routes used
      by crews to deliver trade waste services. Each waste round represents a planned
      set of collections grouped by geography, schedule, and operational team. It
      determines how arrangements are organised into efficient routes for service
      delivery.
    fields:
    - name: Waste Round Name
      description: A descriptive name for the waste collection round. This is used
        as unique identifier of the round within the system
      type: string
      required: true
      unique: true
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: This field acts as a primary key of the Waste Rounds table. Must be
        unique as this is used to reference the waste round on other tables
    - name: Waste Usage Type
      description: Specifies the type of waste service associated with the round (e.g.
        general waste, recycling, food waste)
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Waste Container Usage Type
      remarks: ''
    - name: Team
      description: 'Identifies the operational team responsible for completing the
        waste round. '
      type: string
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: Lookup list will be created with the provided values
      remarks: ''
    - name: Dates
      description: Defines the schedule or applicable dates for the waste round
      type: date
      required: true
      unique: false
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: Add all dates for each waste round. Separate the dates by | e.g. 2026-01-20|2026-02-20|2026-03-20
  bank-holidays:
    name: 11. Bank holidays
    description: The Bank Holiday table stores official public holiday dates and their
      corresponding substitution arrangements where applicable. It is used to support
      scheduling adjustments across the system, ensuring that service delivery accounts
      for non-working public holidays and any rescheduled service days.
    fields:
    - name: Bank Holiday Date
      description: The official date of the bank holiday when normal services are
        typically affected or suspended.
      type: date
      required: true
      unique: ''
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
    - name: Substitution Date
      description: 'The alternative date on which services are rescheduled to take
        place when a bank holiday falls on a regular collection day. '
      type: date
      required: true
      unique: ''
      min: ''
      max: ''
      decimals: ''
      acceptedValues: ''
      remarks: ''
  Lookups:
    name: Lookups
    description: Lookup / reference tables.
    fields:
    - name: Notification Response Type
      values:
      - Information
      - Confirm
      - Acknowledge
    - name: Notification Type
      values:
      - Warning
      - Other
    - name: Named Days Week
      values:
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - Sunday
    - name: Waste Container Usage Type
      values:
      - General
      - Recycling
      - Organic
      - Food
      - Clinical
    - name: Billing Cycle
      values:
      - Annual
      - Bi-annual
      - Quarterly
      - Monthly
